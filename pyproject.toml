[project]
name = "llm-ai-agent"
version = "0.1.0"
description = "Twelve production-style LLM systems, built as one connected portfolio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
llm = ["anthropic>=2.10"]
# Pretrained dense embedders and cross-encoder rerankers (downloads from Hugging Face).
models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore", "src/hybrid_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
